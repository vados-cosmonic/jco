name: targeted-tty-repro

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tty:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: 22.x
          - os: windows-2025
            node: 22.x
          - os: windows-latest
            node: 24.x
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript
        run: |
          pnpm --filter '@bytecodealliance/jco-std' run build:ts
          pnpm --filter '@bytecodealliance/jco' run build:ts
      - name: Report Python runtime
        if: runner.os == 'Linux'
        run: python3 -c 'import os, sys; print(sys.version); print("os.login_tty available:", hasattr(os, "login_tty"))'
      - name: Test only node:tty
        working-directory: packages/jco
        run: pnpm exec vitest run -c test/vitest.lts.ts test/node/tty.js --maxWorkers 1 --maxConcurrency 1
      - name: Test jco-std's PTY helper
        if: runner.os == 'Linux'
        working-directory: packages/jco-std
        run: pnpm exec vitest run -c test/vitest.ts test/wasi/0.2.x/node/24.x.x/tty/pty.ts --maxWorkers 1
